services:
  - type: web
    name: finance-tracker
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_URL
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
# Configure GEMINI_API_KEY only as a Supabase Edge Function secret, never as VITE_GEMINI_API_KEY.
